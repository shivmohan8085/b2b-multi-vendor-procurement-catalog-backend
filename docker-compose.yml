version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: procureflow
      POSTGRES_USER: procureflow
      POSTGRES_PASSWORD: procureflow123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment: &app_env
      DEBUG: "True"
      SECRET_KEY: docker-secret-key-not-for-production
      USE_SQLITE: "False"
      DB_NAME: procureflow
      DB_USER: procureflow
      DB_PASSWORD: procureflow123
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@procureflow.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment: *app_env
    depends_on:
      - web
      - redis

  celery_beat:
    build: .
    command: sh -c "sleep 10 && celery -A config beat -l info"
    volumes:
      - .:/app
    environment: *app_env
    depends_on:
      - web
      - redis

volumes:
  postgres_data:



